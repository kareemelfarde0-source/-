name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        # الريبو مالوش ملف gradlew (Gradle Wrapper)، فبنثبت Gradle
        # نفسه هنا بدل ما نعتمد على ملف ناقص.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore
        # debug.keystore متجاهل من git (.gitignore)، فمش موجود في الريبو.
        # الخطوة دي بتعيد إنشاء نفس ملف التوقيع القياسي بتاع أندرويد
        # اللي signingConfigs.debugConfig محتاجه في جذر المشروع.
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10950 \
            -keyalg RSA \
            -keysize 2048

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
